<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift — EoS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFBF7; --card:#FFFFFF; --ink:#2B2622; --mute:#7A6F66; --line:#E8E0D6;
  --accent:#C4663A; --green:#4F7A4A; --greenbg:#E6F0E4; --amber:#B8860B; --amberbg:#FBF0D8;
  --red:#A63D40; --redbg:#F8E3E3; --core:#E8F0E6;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Manrope,system-ui,sans-serif;
     padding-bottom:calc(150px + var(--safe-b));overscroll-behavior-y:contain}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1{font:700 23px/1.15 Fraunces,Georgia,serif;margin:14px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:12px}
.applinks{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.applinks::-webkit-scrollbar{display:none}
.applinks a{flex:0 0 auto;display:flex;align-items:center;gap:5px;text-decoration:none;
  border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;
  padding:6px 12px;font:700 11.5px Manrope;letter-spacing:.04em;white-space:nowrap}
.applinks a.here{background:var(--ink);color:#fff;border-color:var(--ink)}
.applinks a svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:11px 4px;border:1px solid var(--line);background:var(--card);border-radius:11px;
     font:700 13px Manrope;color:var(--mute);text-align:center;cursor:pointer}
.tab .d{display:block;font-weight:400;font-size:10.5px;margin-top:2px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
    border-radius:11px;padding:5px 7px;flex:1}
.wk button{width:32px;height:32px;border:none;background:#F3EDE4;border-radius:8px;font:700 17px Manrope;
           color:var(--ink);cursor:pointer}
.wk button:disabled{opacity:.3}
.wk .lbl{flex:1;text-align:center;font:700 13.5px Manrope}
.wk .lbl small{display:block;font-weight:400;font-size:10.5px;color:var(--mute)}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;
        font:700 12.5px Manrope;color:var(--mute);cursor:pointer;white-space:nowrap}
.toggle.on{background:var(--core);border-color:var(--green);color:var(--green)}
.dateline{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12.5px;color:var(--mute)}
.dateline input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;
                padding:8px 10px;font:500 13px Manrope;color:var(--ink)}
.group{border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden;background:var(--card)}
.group.core{border-color:#BFD4BA;box-shadow:0 0 0 2px var(--core)}
.ghead{display:flex;align-items:center;gap:7px;padding:7px 12px;background:#FAF6F0;
       border-bottom:1px solid var(--line);font:700 11px Manrope;letter-spacing:.07em;
       text-transform:uppercase;color:var(--mute)}
.group.core .ghead{background:var(--core);color:var(--green)}
.badge{background:var(--green);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;letter-spacing:.05em}
.ex{padding:11px 12px;border-top:1px solid #F2EBE1}
.ex:first-of-type{border-top:none}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exn{font:700 15px Manrope;line-height:1.25;flex:1}
.pill{font:700 10.5px Manrope;border-radius:5px;padding:2px 6px;background:#F3EDE4;color:var(--mute);white-space:nowrap}
.meta{font-size:11.5px;color:var(--mute);margin-top:3px}
.info{background:none;border:none;color:var(--mute);font-size:13px;padding:0 0 0 5px;cursor:pointer}
.cues{display:none;margin-top:8px;padding:9px 11px;background:#FAF6F0;border-radius:9px;
      font-size:12.5px;line-height:1.55;white-space:pre-line;color:#5A5048}
.cues.show{display:block}
.row{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.wt{display:flex;align-items:center;gap:5px;background:#F3EDE4;border-radius:9px;padding:4px 7px}
.wt label{font-size:10.5px;color:var(--mute);font-weight:700}
.wt input{width:58px;border:none;background:none;font:700 15px Manrope;color:var(--ink);text-align:center;padding:3px 0}
.sides{font-size:10.5px;font-weight:700;color:var(--mute);width:13px}
.sets{display:flex;gap:6px;flex:1;min-width:0}
.sets input{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;
            padding:9px 2px;font:700 15px Manrope;text-align:center;color:var(--ink)}
.sets input:focus{outline:none;border-color:var(--accent);background:#fff}
.sets input.dash{background:#F0ECE6;border-color:#F0ECE6;color:#C4BBB1}
.sets input.hit{background:var(--greenbg);border-color:#BFD4BA}
.st{margin-top:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font:700 11px Manrope;border-radius:6px;padding:3px 8px}
.t-up{background:var(--greenbg);color:var(--green)}
.t-on{background:var(--amberbg);color:var(--amber)}
.t-hv{background:var(--redbg);color:var(--red)}
.nx{font-size:11.5px;color:var(--mute)}
.timer{position:fixed;left:0;right:0;bottom:0;background:rgba(253,251,247,.97);
       backdrop-filter:blur(12px);border-top:1px solid var(--line);
       padding:9px 14px calc(9px + var(--safe-b));z-index:50}
.timer .inner{max-width:560px;margin:0 auto}
.chips{display:flex;gap:5px;margin-bottom:7px}
.chip{flex:1;padding:7px 2px;border:1px solid var(--line);background:var(--card);border-radius:8px;
      font:700 12px Manrope;color:var(--mute);text-align:center;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.trun{display:flex;gap:8px;align-items:stretch}
.go{flex:1;border:none;border-radius:12px;background:var(--ink);color:#fff;
    font:700 17px Manrope;padding:14px;cursor:pointer;letter-spacing:.01em}
.go.run{background:var(--accent);font-variant-numeric:tabular-nums;font-size:26px;
        font-family:Fraunces,Georgia,serif;padding:9px}
.go.done{background:var(--green)}
.rst{width:56px;border:1px solid var(--line);background:var(--card);border-radius:12px;
     font-size:17px;color:var(--mute);cursor:pointer}
.tools{display:flex;gap:7px;margin:16px 0 26px}
.tools button{flex:1;padding:12px 6px;border:1px solid var(--line);background:var(--card);
              border-radius:11px;font:700 12.5px Manrope;color:var(--ink);cursor:pointer}
.note{font-size:11.5px;color:var(--mute);line-height:1.5;margin-bottom:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + var(--safe-b));
       background:var(--ink);color:#fff;padding:10px 17px;border-radius:999px;font:700 13px Manrope;
       opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
.toast.on{opacity:1}
dialog{border:none;border-radius:16px;padding:0;max-width:92vw;width:460px;background:var(--card);
       color:var(--ink);box-shadow:0 14px 50px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(43,38,34,.45)}
.dlg{padding:17px}
.dlg h3{font:700 17px Fraunces,Georgia,serif;margin:0 0 9px}
.dlg textarea{width:100%;height:210px;border:1px solid var(--line);border-radius:10px;padding:10px;
              font:400 11.5px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);resize:vertical}
.dlg .acts{display:flex;gap:8px;margin-top:11px}
.dlg .acts button{flex:1;padding:11px;border:none;border-radius:10px;font:700 13px Manrope;cursor:pointer}
.pri{background:var(--ink);color:#fff}
.sec{background:#F3EDE4;color:var(--ink)}
</style>
</head>

  <h1>Lift</h1>
  <div class="sub" id="sub">Full body · antagonist paired</div>

<script>
const LIB={"Barbell Bench Press": {"equip": "Barbell \u2014 total incl. 45 lb bar", "inc": 5, "mn": 5, "aim": 8, "sets": 4, "bil": false, "cues": "\u2022 Flat bench, slight arch, shoulder blades pinned down and back into the pad; feet flat and driving into the floor.\n\u2022 Grip so forearms are vertical at the bottom. Lower to mid-chest under control (2 sec), touch, then press.\n\u2022 Breathe in on the way down, brace, exhale through the sticking point.\n\u2022 Avoid: bouncing off the chest, flaring elbows to 90\u00b0, hips lifting off the bench.\n\u2022 Solo lifting: use the safety arms in the rack or stay 1\u20132 reps shy of failure. No spotter means no grinders."}, "Seated DB Shoulder Press": {"equip": "Dumbbells \u2014 weight PER HAND", "inc": 5, "mn": 6, "aim": 10, "sets": 3, "bil": false, "cues": "\u2022 Bench upright (or 1 notch back), core braced, ribs down \u2014 do not lean back and turn it into an incline press.\n\u2022 Start at ear height, press up and slightly in until the bells nearly touch. Full lockout, no bar path drift.\n\u2022 Kick the dumbbells up with your knees to get into position; set them down the same way.\n\u2022 Avoid: arching the low back, pressing too far in front of the body, half reps at the top."}, "Incline DB Press": {"equip": "Dumbbells \u2014 weight PER HAND", "inc": 5, "mn": 8, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Bench at 30\u201345\u00b0. Any steeper and it becomes a shoulder press.\n\u2022 Shoulder blades retracted, elbows about 45\u00b0 from the torso, wrists stacked over elbows.\n\u2022 Lower until you feel a stretch across the upper chest, then press up and slightly together.\n\u2022 Avoid: clanging the bells together at the top, bouncing out of the bottom, letting elbows flare to 90\u00b0."}, "Pec Deck (Chest Fly Machine)": {"equip": "Selectorized stack \u2014 pin weight", "inc": 10, "mn": 10, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Seat height so the handles sit at mid-chest level and your elbows are level with your shoulders.\n\u2022 Back flat against the pad, feet planted. Soft fixed elbow bend \u2014 the angle never changes during the rep.\n\u2022 Squeeze the chest to bring the pads together, hold 1 sec, control the return until you feel the stretch.\n\u2022 Avoid: shrugging, letting the arms straighten into a press, slamming the stack on the return."}, "DB Lateral Raise": {"equip": "Dumbbells \u2014 weight PER HAND", "inc": 2.5, "mn": 12, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Stand tall, slight forward lean is fine, tiny fixed bend in the elbows.\n\u2022 Lead with the elbows, raise to shoulder height, pinkies slightly high. Lower slowly (2\u20133 sec).\n\u2022 Light weight is correct here \u2014 if you have to swing, it is too heavy.\n\u2022 Avoid: shrugging the traps, using body English, going above shoulder height."}, "Rope Overhead Triceps Extension": {"equip": "Cable stack \u2014 pin weight", "inc": 10, "mn": 10, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Rope on a high pulley, face away, split stance, torso leaned forward about 30\u00b0.\n\u2022 Upper arms locked beside the ears and stationary; only the forearms move.\n\u2022 Extend until the elbows lock and spread the rope apart at the top, then control back to a deep stretch.\n\u2022 Avoid: elbows drifting forward or flaring wide, turning it into a pressdown, using the low back to move the weight."}, "Barbell Deadlift": {"equip": "Barbell \u2014 total incl. 45 lb bar", "inc": 10, "mn": 5, "aim": 5, "sets": 3, "bil": false, "cues": "\u2022 Bar over mid-foot, feet hip-width, grip just outside the shins. Hinge to the bar \u2014 do not squat down to it.\n\u2022 Chest up, lats engaged (think \"protect your armpits\"), take the slack out of the bar before you pull.\n\u2022 Push the floor away, keep the bar dragging up the legs, lock out with glutes \u2014 do not hyperextend.\n\u2022 Reset every rep. Breathe at the top, brace, then descend.\n\u2022 Avoid: rounding the low back, hips shooting up first, jerking the bar off the floor.\n\u2022 Solo lifting: use the platform, drop the bar if a rep goes wrong. This lift needs no spotter."}, "Lat Pulldown": {"equip": "Selectorized stack \u2014 pin weight", "inc": 10, "mn": 8, "aim": 10, "sets": 4, "bil": false, "cues": "\u2022 Thigh pads snug, sit tall, slight fixed lean-back (about 15\u00b0) that does not change during the set.\n\u2022 Grip just outside shoulder width. Start by pulling the shoulder blades DOWN, then bend the elbows.\n\u2022 Pull to the top of the chest, pause, control the bar all the way up to a full stretch.\n\u2022 Avoid: leaning back further as you fatigue, pulling behind the neck, letting the shoulders shrug up at the top."}, "Seated Cable Row": {"equip": "Cable stack \u2014 pin weight", "inc": 10, "mn": 8, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Sit tall, knees softly bent, chest up, torso roughly upright and STILL.\n\u2022 Pull the handle to the navel, elbows tucked, driving the shoulder blades together at the end.\n\u2022 Let the arms extend fully and allow a small controlled stretch of the shoulder blades on the return.\n\u2022 Avoid: rocking the torso back and forth, shrugging, jerking the start of the pull."}, "1-Arm DB Row": {"equip": "Dumbbells \u2014 weight PER HAND", "inc": 5, "mn": 10, "aim": 12, "sets": 3, "bil": true, "cues": "\u2022 One knee and one hand on the bench, back flat and roughly parallel to the floor, hips square.\n\u2022 Let the arm hang and the shoulder blade protract at the bottom, then row toward the hip, elbow close to the body.\n\u2022 Pause 1 sec at the top with the shoulder blade pulled back. Lower under control.\n\u2022 Log the LEFT set on the top row and RIGHT on the row below. Status uses your weaker side.\n\u2022 Avoid: twisting the torso to help, rowing to the armpit, yanking with the low back."}, "Rear Delt Machine": {"equip": "Selectorized stack \u2014 pin weight", "inc": 10, "mn": 12, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Chest against the pad, seat height so the handles are at shoulder level.\n\u2022 Soft FIXED elbow bend. Lead with the elbows and sweep back, not down.\n\u2022 Squeeze for 1 sec at the back, then control the return without letting the plates touch down.\n\u2022 Avoid: bending the elbows more as you fatigue, shrugging, using momentum off the chest pad."}, "EZ-Bar Biceps Curl": {"equip": "EZ bar \u2014 total incl. 25 lb bar", "inc": 5, "mn": 8, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Stand tall, elbows pinned to your sides, shoulders back, core braced.\n\u2022 Curl up without letting the elbows travel forward. Squeeze at the top, lower for 2\u20133 sec to a full stretch.\n\u2022 The angled EZ grip is easier on the wrists than a straight bar \u2014 use the inner slant.\n\u2022 Avoid: swinging the hips, elbows drifting forward, cutting the bottom half of the rep."}, "DB Hammer Curl": {"equip": "Dumbbells \u2014 weight PER HAND", "inc": 5, "mn": 8, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Neutral grip (palms facing each other) held throughout \u2014 no rotation.\n\u2022 Elbows pinned to the sides, curl straight up, squeeze, lower slowly to full extension.\n\u2022 Can be done both arms together or alternating; keep it consistent week to week.\n\u2022 Avoid: swinging, letting the wrists roll inward, shortening the bottom of the rep."}, "EZ-Bar Wrist Curl": {"equip": "EZ bar \u2014 total incl. 25 lb bar", "inc": 5, "mn": 12, "aim": 15, "sets": 2, "bil": false, "cues": "\u2022 Seated, forearms resting on the thighs or a bench, palms UP, wrists just past the edge.\n\u2022 Let the bar roll down to the fingertips, then curl it back up and squeeze. Small range, slow tempo.\n\u2022 Avoid: lifting the forearms off the pad, bouncing, going so heavy that the wrists hyperextend."}, "EZ-Bar Reverse Wrist Curl": {"equip": "EZ bar \u2014 total incl. 25 lb bar", "inc": 5, "mn": 12, "aim": 15, "sets": 2, "bil": false, "cues": "\u2022 Same setup but palms DOWN, wrists just past the edge of the thighs or bench.\n\u2022 Extend the wrists up as far as they will go, hold 1 sec, lower slowly.\n\u2022 This will be much lighter than the palms-up version \u2014 that is normal.\n\u2022 Avoid: using the elbows or shoulders to help, rushing the reps."}, "Hack Squat": {"equip": "Plate-loaded \u2014 PLATE weight only", "inc": 10, "mn": 8, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Back and hips flat against the pad, shoulders under the pads, feet shoulder-width in the middle of the platform.\n\u2022 Descend under control to at least parallel (thighs to the footplate), knees tracking over the toes.\n\u2022 Drive through mid-foot and heel. Do not lock the knees hard at the top.\n\u2022 Log PLATE weight only \u2014 the sled itself is not counted, so stay consistent week to week.\n\u2022 Avoid: hips rounding off the pad at the bottom, bouncing out of the hole, feet too high (turns it into a leg press)."}, "Leg Press": {"equip": "Plate-loaded \u2014 PLATE weight only", "inc": 20, "mn": 10, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Hips and low back flat in the seat, feet shoulder-width, mid-height on the platform.\n\u2022 Lower until the knees reach about 90\u00b0, or as deep as you can go WITHOUT the hips curling off the seat.\n\u2022 Press through the whole foot. Leave a soft bend in the knees at the top.\n\u2022 Log PLATE weight only. Set the safety catches before your first working set.\n\u2022 Avoid: hips rounding under (the classic low-back injury), locking the knees out hard, hands pushing on the knees."}, "Seated Leg Curl": {"equip": "Selectorized stack \u2014 pin weight", "inc": 10, "mn": 10, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Knee joint lined up with the machine pivot, thigh pad snug, back flat against the seat.\n\u2022 Curl the heels down and under, squeeze the hamstrings hard for 1 sec at the bottom.\n\u2022 Return slowly (3 sec) to a full stretch without letting the stack rest.\n\u2022 Avoid: hips lifting off the seat, snapping the reps, cutting the top stretch short."}, "Hip Thrust (machine or barbell)": {"equip": "Stack or barbell \u2014 see setup note", "inc": 10, "mn": 10, "aim": 12, "sets": 3, "bil": false, "cues": "\u2022 Machine: back pad at the bottom of the shoulder blades, feet flat, shins vertical at the top.\n\u2022 Barbell version: upper back on a bench, pad on the hips, feet shoulder-width and flat.\n\u2022 Drive through the heels, squeeze the glutes hard at lockout, ribs DOWN and chin tucked \u2014 do not arch the low back.\n\u2022 Pause 1 sec at the top of every rep. Lower under control.\n\u2022 Avoid: hyperextending the lumbar spine at lockout, pushing through the toes, half reps."}, "Leg Extension": {"equip": "Selectorized stack \u2014 pin weight", "inc": 10, "mn": 12, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Knee pivot aligned with the machine axis, shin pad just above the ankles, back into the seat.\n\u2022 Extend to full lockout, squeeze the quads for 1 sec, lower slowly (3 sec).\n\u2022 Hold the handles lightly \u2014 no yanking to help the last reps.\n\u2022 Avoid: swinging the torso, bouncing out of the bottom, letting the weight drop back fast."}, "Calf Raise Machine": {"equip": "Stack or plate-loaded \u2014 see machine", "inc": 10, "mn": 12, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Balls of the feet on the edge of the platform, legs straight (or a slight fixed knee bend for a standing machine).\n\u2022 Drop the heels for a deep stretch, pause 1 sec at the BOTTOM, then rise all the way onto the toes.\n\u2022 Pause 1 sec at the top too. Calves respond to full range and pauses, not to bouncing.\n\u2022 Avoid: quarter reps, bouncing on the achilles, bending the knees to cheat the weight up."}, "Cable Crunch": {"equip": "Cable stack \u2014 pin weight", "inc": 10, "mn": 12, "aim": 15, "sets": 3, "bil": false, "cues": "\u2022 Kneel facing the stack, rope held at the upper chest or beside the ears, hips const DATES={"A|1": "2026-09-15"};
const APP_VERSION = "1.1.1";
const K = "eos_lift_v1";

/* ---------- state ---------- */
let S = { log:{}, dates:{}, ui:{ day:"A", week:1, core:false }, rest:{ short:60, long:105 } };
try{
  const raw = localStorage.getItem(K);
  if(raw){ const p = JSON.parse(raw); S = Object.assign(S, p); S.ui = Object.assign({day:"A",week:1,core:false}, p.ui||{}); }
  else { S.log = JSON.parse(JSON.stringify(SEED)); S.dates = Object.assign({}, DATES); }

const key = (d,w,ex) => d+"|"+w+"|"+ex;
const rec = (d,w,ex) => S.log[key(d,w,ex)] || null;
const ensure = (d,w,ex) => (S.log[key(d,w,ex)] = S.log[key(d,w,ex)] || {});

/* ---------- progression ---------- */
let memo = {};
const clearMemo = () => { memo = {}; };
function cached(tag,d,w,ex,fn){ const k=tag+"|"+d+"|"+w+"|"+ex; if(k in memo) return memo[k]; return (memo[k]=fn()); }

function weightOf(d,w,ex){
  return cached("w",d,w,ex,()=>{
    const r = rec(d,w,ex);
    if(r && r.w!=null && r.w!=="") return +r.w;
    if(w<=1){ const s=SEED[key(d,1,ex)]; return s && s.w!=null ? +s.w : 0; }
    return weightOf(d,w-1,ex) + deltaOf(d,w-1,ex);
  });
}
function repsArr(d,w,ex,side){
  const r = rec(d,w,ex); if(!r) return [];
  if(LIB[ex].bil) return (side==="R" ? r.R : r.L) || [];
  return r.s || [];
}
function countAtLeast(arr,n,sets){ let c=0; for(let i=0;i<sets;i++){ const v=arr[i]; if(typeof v==="number" && v>=n) c++; } return c; }
function filled(arr,sets){ let c=0; for(let i=0;i<sets;i++){ if(typeof arr[i]==="number") c++; } return c; }

function statusOf(d,w,ex){
  return cached("st",d,w,ex,()=>{
    const L=LIB[ex], n=L.sets;
    if(L.bil){
      const a=repsArr(d,w,ex,"L"), b=repsArr(d,w,ex,"R");
      if(filled(a,n)<n || filled(b,n)<n) return null;
      const cAim=Math.min(countAtLeast(a,L.aim,n),countAtLeast(b,L.aim,n));
      const cMin=Math.min(countAtLeast(a,L.mn,n),countAtLeast(b,L.mn,n));
      return cAim>=n ? "READY" : (n-cMin>=2 ? "HEAVY" : "ON");
    }
    const s=repsArr(d,w,ex);
    if(filled(s,n)<n) return null;
    const cAim=countAtLeast(s,L.aim,n), cMin=countAtLeast(s,L.mn,n);
    return cAim>=n ? "READY" : (n-cMin>=2 ? "HEAVY" : "ON");
  });
}
function repSum(d,w,ex){
  const L=LIB[ex], n=L.sets; let t=0;
  const add=a=>{ for(let i=0;i<n;i++) if(typeof a[i]==="number") t+=a[i]; };
  if(L.bil){ add(repsArr(d,w,ex,"L")); add(repsArr(d,w,ex,"R")); } else add(repsArr(d,w,ex));
  return t;
}
const deload = (wt,inc) => Math.max(inc, inc*Math.round(wt*0.1/inc));
function improvedOf(d,w,ex){
  if(w<=1) return false;
  return weightOf(d,w,ex)>=weightOf(d,w-1,ex) && repSum(d,w,ex)>repSum(d,w-1,ex);
}
function stallCountOf(d,w,ex){
  return cached("sc",d,w,ex,()=>{
    const st=statusOf(d,w,ex); if(!st) return null;
    if(st!=="ON") return 0;
    if(w<=1) return 1;
    if(deltaOf(d,w-1,ex)<0 || improvedOf(d,w,ex)) return 0;
    return (stallCountOf(d,w-1,ex)||0)+1;
  });
}
function stalledOf(d,w,ex){
  if(w<=1) return false;
  if(statusOf(d,w,ex)!=="ON") return false;
  return (stallCountOf(d,w-1,ex)||0)>=2 && deltaOf(d,w-1,ex)>=0 && !improvedOf(d,w,ex);
}
function deltaOf(d,w,ex){
  return cached("dl",d,w,ex,()=>{
    const st=statusOf(d,w,ex); if(!st) return 0;
    const L=LIB[ex], wt=weightOf(d,w,ex);
    if(st==="READY") return L.inc;
    if(st==="HEAVY") return -deload(wt,L.inc);
    if(stalledOf(d,w,ex)) return -deload(wt,L.inc);
    return 0;
  });
}

        const fld = L.bil ? (side==="R"?"R":"L") : "s";
        r[fld]=r[fld]||[];
        const v=parseInt(inp.value,10);
        r[fld][i]=isNaN(v)?null:v;
        if(r.w==null) r.w=wt;
        save(); clearMemo();
        inp.className = (!isNaN(v)&&v>=L.aim) ? "hit" : "";
        refreshStatus();
      };
      sets.appendChild(inp);
    }
    row.appendChild(sets);
    return row;
  };
  if(L.bil){ node.appendChild(mk("L")); node.appendChild(mk("R")); }
  else node.appendChild(mk(null));

  const stRow=el("div","st"); stRow.dataset.ex=ex; node.appendChild(stRow);
  paintStatus(stRow,d,w,ex);
  return node;
}
function paintStatus(row,d,w,ex){
  row.innerHTML="";
  const st=statusOf(d,w,ex);
  if(!st){ row.appendChild(el("span","nx","Not logged yet")); return; }
  const map={READY:["t-up","READY TO ↑"],ON:["t-on","ON TRACK"],HEAVY:["t-hv","TOO HEAVY"]};
  row.appendChild(el("span","tag "+map[st][0],map[st][1]));
  const dl=deltaOf(d,w,ex), nw=weightOf(d,w,ex)+dl;
  let txt = dl>0 ? "+"+fmt(dl)+" lb → "+fmt(nw)+" next week"
          : dl<0 ? fmt(dl)+" lb → "+fmt(nw)+" next week"
          : "Hold "+fmt(nw)+" — add reps";
  if(stalledOf(d,w,ex)) txt = "⚠ Stalled · "+txt;
  row.appendChild(el("span","nx",txt));
}
function refreshStatus(){
  const d=S.ui.day,w=S.ui.week;
  document.querySelectorAll(".st").forEach(r=>paintStatus(r,d,w,r.dataset.ex));
  let done=0,tot=0;
  groupsFor(d).filter(g=>!S.ui.core||g.core).forEach(g=>g.items.forEach(e=>{tot++; if(statusOf(d,w,e.ex))done++;}));
  $("#wst").textContent=done+" of "+tot+" logged";
}

/* ---------- timer ---------- */
const DURS=[45,60,90,105,120,180];
let pick=60, endAt=0, tick=null, lock=null, ac=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1900); }
function renderChips(){
  const c=$("#chips"); c.innerHTML="";
  DURS.forEach(s=>{
    const b=el("div","chip"+(pick===s?" on":""), s>=60?(s%60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s/60+":00"):s+"s");
    b.onclick=()=>{ pick=s; renderChips(); };
    c.appendChild(b);
  });
}
function pickRest(pair){
  if(tick) return;
  const want = /a$/.test(pair) ? S.rest.short : S.rest.long;
  if(DURS.includes(want)){ pick=want; renderChips(); }
}
function beep(){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    [0,0.22,0.44].forEach(off=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,ac.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.5,ac.currentTime+off+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+off+0.17);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+off); o.stop(ac.currentTime+off+0.2);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([220,110,220,110,330]);
}
async function wake(on){
  try{
    if(on && "wakeLock" in navigator && !lock) lock = await navigator.wakeLock.request("screen");
    if(!on && lock){ lock.release(); lock=null; }
  }catch(e){}
}
function paintGo(){
  const g=$("#go");
  if(!tick){ g.className="go"; g.textContent="Start rest"; return; }
  const left=Math.max(0,Math.round((endAt-Date.now())/1000));
  g.className="go run"; g.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left<=0){ stopTimer(true); }
}
function startTimer(){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){}
  endAt = Date.now()+pick*1000;
  if(tick) clearInterval(tick);
  tick = setInterval(paintGo, 200);
  wake(true); paintGo();
}
function stopTimer(fired){
  if(tick) clearInterval(tick); tick=null; wake(false);
  const g=$("#go");
  if(fired){ beep(); g.className="go done"; g.textContent="Go ✓"; setTimeout(()=>{ if(!tick){ g.className="go"; g.textContent="Start rest"; } },3500); }
  else { g.className="go"; g.textContent="Start rest"; }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(tick) paintGo(); wake(!!tick); } });

/* ---------- export ---------- */
function weekRows(){
  const d=S.ui.day,w=S.ui.week,out=[];
  PROG[d].ex.forEach(e=>{
    const L=LIB[e.ex];
    const pad=a=>{const o=[];for(let i=0;i<4;i++)o.push(i<L.sets?(typeof a[i]==="number"?a[i]:""):"—");return o;};
    if(L.bil){
      out.push([e.ex,"L",weightOf(d,w,e.ex)].concat(pad(repsArr(d,w,e.ex,"L"))));
      out.push(["","R",""].concat(pad(repsArr(d,w,e.ex,"R"))));
    } else out.push([e.ex,"",weightOf(d,w,e.ex)].concat(pad(repsArr(d,w,e.ex))));
  });
  return out;
}
function show(title,text){ $("#dlgT").textContent=title; $("#dlgX").value=text; $("#dlg").showModal(); }
$("#dlgK").onclick=()=>$("#dlg").close();
$("#dlgC").onclick=async()=>{
  const t=$("#dlgX");
  try{ await navigator.clipboard.writeText(t.value); toast("Copied"); }
  catch(e){ t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); t.setAttribute("readonly",""); toast("Copied"); }
};
$("#bCopy").onclick=()=>show("Paste into Excel (Weight, Side, Set 1–4)",
  weekRows().map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6]].join("\t")).join("\n"));
$("#bClaude").onclick=()=>{
  const d=S.ui.day,w=S.ui.week;
  let s="Day "+d+" ("+PROG[d].dow+"), week "+w+(S.dates[d+"|"+w]?" — "+S.dates[d+"|"+w]:"")+"\n";
  PROG[d].ex.forEach(e=>{
    const L=LIB[e.ex], st=statusOf(d,w,e.ex);
    const line=a=>a.slice(0,L.sets).map(v=>typeof v==="number"?v:"–").join("/");
    s+="- "+e.ex+" @"+fmt(weightOf(d,w,e.ex))+": "
      + (L.bil ? "L "+line(repsArr(d,w,e.ex,"L"))+" | R "+line(repsArr(d,w,e.ex,"R")) : line(repsArr(d,w,e.ex)))
      + (st?"  ["+({READY:"ready to increase",ON:"on track",HEAVY:"too heavy"})[st]+"]":"  [not logged]")+"\n";
  });
  show("Copy for Claude", s);
};
$("#bBackup").onclick=()=>show("Full backup (JSON)", JSON.stringify(S));

/* ---------- wiring ---------- */
$("#wprev").onclick=()=>{ if(S.ui.week>1){S.ui.week--;save();render();} };
$("#wnext").onclick=()=>{ if(S.ui.week<24){S.ui.week++;save();render();} };
$("#coreBtn").onclick=()=>{ S.ui.core=!S.ui.core; save(); render(); };
$("#dt").onchange=e=>{ S.dates[S.ui.day+"|"+S.ui.week]=e.target.value; save(); };
$("#go").onclick=()=>{ tick ? stopTimer(false) : startTimer(); };
$("#rst").onclick=()=>{ if(tick){ stopTimer(false); } startTimer(); };
renderChips(); render();

</script>
</body>
</html>
